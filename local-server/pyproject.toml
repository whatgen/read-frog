[project]
name = "read-frog-local-server"
version = "0.1.0"
description = "Local AI subtitle service for Read Frog: YouTube audio -> MLX Whisper -> timed segments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlx-whisper>=0.4.2",
  "yt-dlp>=2025.1.1",
  # Ships a static ffmpeg binary, so nothing has to be installed system-wide.
  "imageio-ffmpeg>=0.5.1",
]

[tool.uv]
package = false
